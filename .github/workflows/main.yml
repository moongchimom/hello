name: WAR 직접 배포 (호스트 톰캣)

on:
  push:
    branches:
      - main      # main 브랜치에 push되면 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: Java 8 세팅
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: 메이븐 빌드 (WAR 패키징)
      run: mvn -B clean package -DskipTests

    - name: EC2로 WAR 파일 전송 (SCP)
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.EC2_EGOV_HOST }}
        username: ${{ secrets.EC2_EGOV_USERNAME }}
        key: ${{ secrets.EC2_EGOV_KEY }}
        source: "target/hello-1.0.0.war"
        target: "/home/ubuntu"
        strip_components: 1

    - name: 원격 배포 및 톰캣 재기동 (SSH)
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.EC2_EGOV_HOST }}
        username: ${{ secrets.EC2_EGOV_USERNAME }}
        key: ${{ secrets.EC2_EGOV_KEY }}
        script: |
          # 0. docker.yml 로 띄운 컨테이너가 있으면 먼저 내린다 (80 포트 선점 해제)
          if command -v docker >/dev/null; then
            sudo docker rm -f hello 2>/dev/null || true
          fi

          # 1. 기존 톰캣 중지
          /opt/tomcat9/bin/shutdown.sh >/dev/null 2>&1 || true

          # 종료 대기 (최대 30초)
          for i in $(seq 1 15); do
            pgrep -f "[B]ootstrap start" >/dev/null || break
            sleep 2
          done

          # 그래도 살아 있으면 강제 종료.
          # 패턴을 [B] 로 쪼개는 이유: drone-ssh 는 이 스크립트를 원격 셸의
          # 명령줄로 넘기므로, pkill -f tomcat 같은 평범한 패턴은 자기 SSH
          # 세션에 매칭되어 스스로를 죽인다(exit 143, signal TERM).
          pkill -f "[B]ootstrap start" || true

          # 2. 기존 ROOT 정리
          rm -rf /opt/tomcat9/webapps/ROOT /opt/tomcat9/webapps/ROOT.war

          # 3. 새로 전송된 WAR 파일을 ROOT.war로 이동
          mv /home/ubuntu/hello-1.0.0.war /opt/tomcat9/webapps/ROOT.war

          # 4. 톰캣 기동
          /opt/tomcat9/bin/startup.sh
