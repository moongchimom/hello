name: 전자정부프레임워크 빌드 및 배포

on:
  push:
    branches:
      - main      # main 브랜치에 push되면 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 체크아웃
      uses: actions/checkout@v3

    - name: Java 11 세팅
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: 메이븐 빌드 (WAR 패키징)
      run: mvn clean package -DskipTests

    - name: SSH 디렉터리 및 개인키 설정
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_EGOV_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_EGOV_HOST }} >> ~/.ssh/known_hosts

    - name: 운영서버에 WAR 전송 및 톰캣 재기동
      run: |
        # 1. 빌드된 WAR 파일을 EC2 홈 디렉터리로 전송
        scp -i ~/.ssh/id_rsa target/hello-1.0.0.war ubuntu@${{ secrets.EC2_EGOV_HOST }}:/home/ubuntu/ROOT.war

        # 2. EC2 내부에서 배포 및 톰캣 재시작 실행
        ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_EGOV_HOST }} << 'EOF'
          # 기존 톰캣 프로세스 종료
          /opt/tomcat9/bin/shutdown.sh || true
          sleep 2
          pkill -f tomcat || true

          # 기존 배포 파일 및 폴더 삭제
          rm -rf /opt/tomcat9/webapps/ROOT /opt/tomcat9/webapps/ROOT.war

          # 전송받은 새 WAR 파일 배치
          cp /home/ubuntu/ROOT.war /opt/tomcat9/webapps/ROOT.war

          # 톰캣 재기동
          /opt/tomcat9/bin/startup.sh
        EOF