name: 전자정부프레임워크 빌드 및 배포

on:
  push:
    branches:
      - main      # main 브랜치에 push되면 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 체크아웃
      uses: actions/checkout@v3

    - name: Java 8 세팅
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: 메이븐 빌드 (WAR 패키징)
      run: mvn clean package -DskipTests

    - name: EC2로 WAR 파일 전송 (SCP)
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_EGOV_HOST }}
        username: ${{ secrets.EC2_EGOV_USERNAME }}
        key: ${{ secrets.EC2_EGOV_KEY }}
        source: "target/hello-1.0.0.war"
        target: "/home/ubuntu"
        strip_components: 1

    - name: 원격 배포 및 톰캣 재기동 (SSH)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_EGOV_HOST }}
        username: ${{ secrets.EC2_EGOV_USERNAME }}
        key: ${{ secrets.EC2_EGOV_KEY }}
        script: |
          # 1. 기존 톰캣 중지
          /opt/tomcat9/bin/shutdown.sh || true
          sleep 2
          pkill -f tomcat || true

          # 2. 기존 ROOT 정리
          rm -rf /opt/tomcat9/webapps/ROOT /opt/tomcat9/webapps/ROOT.war

          # 3. 새로 전송된 WAR 파일을 ROOT.war로 이동
          mv /home/ubuntu/hello-1.0.0.war /opt/tomcat9/webapps/ROOT.war

          # 4. 톰캣 기동
          /opt/tomcat9/bin/startup.sh